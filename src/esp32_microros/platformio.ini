[env:esp32dev]
platform = espressif32          ; uses Arduino 3.x core — required for ledcAttach API
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv   ; micro-ROS exceeds default partition size
lib_deps =
    https://github.com/micro-ROS/micro_ros_arduino/archive/refs/heads/humble.zip
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
